# =========================== Metricbeat Configuration ==========================

# 1. Módulos de recolección
metricbeat.modules:

  # --- Métricas del Sistema (Requerimiento de salud general) ---
  - module: system
    period: 10s
    metricsets:
      - cpu
      - load
      - memory
      - network
      - process
      - process_summary
      - socket_summary
    process.include_top_n:
      by_cpu: 5
      by_memory: 5

  # --- Métricas de Docker (Para monitorear tu SIEM) ---
  - module: docker
    metricsets:
      - container
      - cpu
      - diskio
      - healthcheck
      - info
      - memory
      - network
    hosts: ["unix:///var/run/docker.sock"]
    period: 10s

# ================================== Outputs ===================================

# Enviamos directamente a Elasticsearch para no sobrecargar Logstash 
# (las métricas no necesitan parseo Grok complejo)
output.elasticsearch:
  hosts: ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
  protocol: "https"
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"
  ssl.certificate_authorities: ["/usr/share/metricbeat/certs/ca/ca.crt"]
  index: "metricbeat-%{[agent.version]}-%{+yyyy.MM.dd}"

# ================================== Proccessors ===============================
processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~
  - add_cloud_metadata: ~
  - add_fields:
      target: ''
      fields:
        env: "production"
        project: "cloud-siem"

# ================================== Dashboards ================================
# Esto permite que Metricbeat cargue automáticamente los dashboards en Kibana
setup.dashboards.enabled: true

setup.kibana:
  host: "https://kibana:5601"
  protocol: "https"
  ssl.certificate_authorities: ["/usr/share/metricbeat/certs/ca/ca.crt"]