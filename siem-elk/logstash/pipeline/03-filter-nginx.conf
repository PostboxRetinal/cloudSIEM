# =============================================================================
# PIPELINE 03 — FILTRO NGINX
# Parsea access.log y error.log de Nginx/Apache con grok
# Enriquece con GeoIP, User-Agent, clasificación de ataques
# Tasa de éxito objetivo: > 95%
# =============================================================================

filter {

  # ════════════════════════════════════════════════════════════════════════════
  # NGINX ACCESS LOG
  # ════════════════════════════════════════════════════════════════════════════
  if [event][dataset] == "nginx.access" {

    # ── Grok: formato combined (default nginx) ──────────────────────────────
    # Ejemplo de línea:
    # 185.220.101.34 - admin [25/Apr/2024:14:32:01 +0000] "GET /api/v1/users HTTP/1.1" 200 1842 "-" "curl/7.68.0"
    grok {
      match => {
        "message" => [
          # Formato combined completo (con referrer y user agent)
          '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][access][time]}\] "(?:%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}|-)" %{NUMBER:[http][response][status_code]:int} (?:%{NUMBER:[http][response][body][bytes]:int}|-) "(?:%{DATA:[http][request][referrer]}|-)" "(?:%{DATA:[user_agent][original]}|-)"',

          # Formato combined sin referrer/UA
          '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][access][time]}\] "(?:%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}|-)" %{NUMBER:[http][response][status_code]:int} (?:%{NUMBER:[http][response][body][bytes]:int}|-)',

          # Formato con X-Forwarded-For (proxy/CDN)
          '%{IPORHOST:[source][ip]}, %{IPORHOST:[network][forwarded_ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][access][time]}\] "(?:%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}|-)" %{NUMBER:[http][response][status_code]:int} (?:%{NUMBER:[http][response][body][bytes]:int}|-) "(?:%{DATA:[http][request][referrer]}|-)" "(?:%{DATA:[user_agent][original]}|-)"'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx_access"]
    }

    # Sólo continuar si el parseo fue exitoso
    if "_grokparsefailure_nginx_access" not in [tags] {

      # ── Parsear timestamp nginx ───────────────────────────────────────────
      date {
        match    => [ "[nginx][access][time]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target   => "@timestamp"
        timezone => "UTC"
        tag_on_failure => ["_dateparsefailure_nginx"]
      }

      # ── Extraer URL path y query string ──────────────────────────────────
      if [url][original] {
        grok {
          match => {
            "[url][original]" => "^%{URIPATH:[url][path]}(?:\?%{URIQUERY:[url][query]})?$"
          }
          tag_on_failure => []  # fallo silencioso — no siempre hay query
        }
      }

      # ── Calcular duración de respuesta (si nginx lo incluye — $request_time)
      # Descomenta si tu nginx.conf incluye $request_time en el log format:
      # mutate { convert => { "[nginx][access][response_time]" => "float" } }

      # ── Clasificar evento HTTP por código de respuesta ────────────────────
      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "web"
          "[event][module]"   => "nginx"
        }
      }

      # Tipo según código de respuesta
      if [http][response][status_code] {
        if [http][response][status_code] >= 500 {
          mutate {
            add_field => { "[event][type]"    => "error" }
            add_tag   => ["http_5xx"]
          }
        } else if [http][response][status_code] >= 400 {
          mutate {
            add_field => { "[event][type]"    => "denied" }
          }
          # 404 específico — importante para regla de detección R8.4
          if [http][response][status_code] == 404 {
            mutate { add_tag => ["http_404"] }
          }
          # 401/403 — acceso denegado
          if [http][response][status_code] == 401 or [http][response][status_code] == 403 {
            mutate {
              add_tag   => ["access_denied"]
              add_field => { "[event][outcome]" => "failure" }
            }
          }
        } else if [http][response][status_code] >= 300 {
          mutate { add_field => { "[event][type]" => "redirect" } }
        } else {
          mutate {
            add_field => { "[event][type]"    => "allowed" }
            add_field => { "[event][outcome]" => "success" }
          }
        }
      }

      # ── Detección de rutas sensibles (R8.4 — regla acceso a rutas sensibles)
      if [url][path] {
        if [url][path] =~ /(?i)(\/admin|\/wp-admin|\/phpmyadmin|\/\.env|\/config|\/backup|\/\.git|\/etc\/passwd|\/proc\/|\/server-status|\/actuator|\/api\/admin)/ {
          mutate {
            add_tag   => ["sensitive_path_access"]
            add_field => { "[siem][sensitive_path]" => true }
          }
        }
      }

      # ── Detección de inyección SQL en URL (R8.5 — escenario SQLi) ─────────
      if [url][query] or [url][original] {
        # Combinar path+query para análisis
        mutate {
          add_field => { "[siem][url_full]" => "%{[url][original]}" }
        }

        if [siem][url_full] =~ /(?i)(\bunion\b.*\bselect\b|\bselect\b.*\bfrom\b|\binsert\b.*\binto\b|\bdelete\b.*\bfrom\b|\bdrop\b.*\btable\b|\bexec\b\s*\(|\/\*.*\*\/|--\s|'\s*or\s*'|'\s*and\s*'|1=1|0x[0-9a-f]{4}|char\([0-9]+\))/ {
          mutate {
            add_tag   => ["sqli_detected"]
            add_field => {
              "[siem][sqli_detected]"  => true
              "[event][category]"      => "intrusion_detection"
              "[threat][technique][name]" => "SQL Injection"
              "[threat][tactic][name]"    => "Initial Access"
            }
          }
        }

        # ── Detección XSS ─────────────────────────────────────────────────
        if [siem][url_full] =~ /(?i)(<script[\s>]|javascript:|on(?:load|error|click|mouse)\s*=|alert\s*\(|document\.cookie|eval\s*\()/ {
          mutate {
            add_tag   => ["xss_detected"]
            add_field => {
              "[siem][xss_detected]"       => true
              "[threat][technique][name]"  => "Cross-Site Scripting"
            }
          }
        }

        # ── Detección Path Traversal ──────────────────────────────────────
        if [siem][url_full] =~ /(?:\.\.\/|\.\.\\|%2e%2e%2f|%252e%252e%252f)/ {
          mutate {
            add_tag   => ["path_traversal"]
            add_field => { "[siem][path_traversal]" => true }
          }
        }

        mutate { remove_field => ["[siem][url_full]"] }
      }

      # ── Detección de scanners y herramientas de ataque por User-Agent ──────
      if [user_agent][original] {
        if [user_agent][original] =~ /(?i)(nikto|sqlmap|nmap|masscan|zgrab|dirbuster|gobuster|wfuzz|hydra|medusa|metasploit|nessus|openvas|nuclei|burpsuite|zap)/ {
          mutate {
            add_tag   => ["security_scanner"]
            add_field => { "[siem][scanner_detected]" => true }
          }
        }
      }

      # ── Mutate: limpiar campo temporal de nginx ───────────────────────────
      mutate {
        remove_field => [ "[nginx][access][time]" ]
        # Convertir tipos correctamente
        convert => {
          "[http][response][status_code]" => "integer"
          "[http][response][body][bytes]" => "integer"
        }
      }

      # Normalizar IP vacía a guión
      if [user][name] == "-" {
        mutate { replace => { "[user][name]" => "" } }
      }
    }
  }


  # ════════════════════════════════════════════════════════════════════════════
  # NGINX ERROR LOG
  # ════════════════════════════════════════════════════════════════════════════
  if [event][dataset] == "nginx.error" {

    # Ejemplo de línea nginx error:
    # 2024/04/25 14:32:01 [error] 1234#1234: *56 connect() failed (111: Connection refused) while connecting to upstream, client: 10.0.0.5, server: api.example.com, request: "GET /api/v1/health HTTP/1.1", upstream: "http://backend:8080/api/v1/health", host: "api.example.com"
    grok {
      match => {
        "message" => [
          '%{DATA:[nginx][error][time]} \[%{DATA:[log][level]}\] %{NUMBER:[process][pid]:int}#%{NUMBER:[process][tid]:int}: (?:\*%{NUMBER:[nginx][error][connection_id]:int} )?%{DATA:[error][message]}(?:, client: %{IPORHOST:[source][ip]})?(?:, server: %{DATA:[server][domain]})?(?:, request: "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}")?(?:, upstream: "%{DATA:[nginx][error][upstream]}")?(?:, host: "%{DATA:[server][domain2]}")?$'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx_error"]
    }

    if "_grokparsefailure_nginx_error" not in [tags] {
      date {
        match    => [ "[nginx][error][time]", "yyyy/MM/dd HH:mm:ss" ]
        target   => "@timestamp"
        timezone => "UTC"
        tag_on_failure => ["_dateparsefailure_nginx_error"]
      }

      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "web"
          "[event][type]"     => "error"
          "[event][module]"   => "nginx"
        }
        remove_field => ["[nginx][error][time]", "[server][domain2]"]
      }
    }
  }
}
