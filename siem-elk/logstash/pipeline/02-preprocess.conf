# =============================================================================
# PIPELINE 02 — PRE-PROCESAMIENTO
# Normalización de timestamp, routing por dataset, campos base ECS
# Se ejecuta ANTES de los filtros específicos por fuente
# =============================================================================

filter {

  # ── 1. Añadir campos ECS base a todos los eventos ─────────────────────────
  mutate {
    add_field => {
      "ecs.version"        => "8.0"
      "[@metadata][index]" => "unknown"   # se sobreescribe en cada filtro
    }
  }

  # ── 1.1 Limpieza de bytes nulos para evitar fallos de grok ───────────────
  if [message] {
    mutate { gsub => ["message", "\u0000", ""] }
  }
  if [event][original] {
    mutate { gsub => ["[event][original]", "\u0000", ""] }
  }

  # ── 2. Inferir dataset desde campos de Filebeat si no viene explícito ──────
  if ![event][dataset] {
    if [type] == "syslog-udp" or [type] == "syslog-tcp" {
      mutate { add_field => { "[event][dataset]" => "system.syslog" } }
    } else if [log][file][path] =~ /auth\.log|secure$/ {
      mutate { add_field => { "[event][dataset]" => "system.auth" } }
    } else if [log][file][path] =~ /nginx/ and [log][file][path] =~ /access/ {
      mutate { add_field => { "[event][dataset]" => "nginx.access" } }
    } else if [log][file][path] =~ /nginx/ and [log][file][path] =~ /error/ {
      mutate { add_field => { "[event][dataset]" => "nginx.error" } }
    } else if [log][file][path] =~ /apache/ {
      mutate { add_field => { "[event][dataset]" => "nginx.access" } }
    } else if [kubernetes] or [container] {
      mutate { add_field => { "[event][dataset]" => "kubernetes.container" } }
    } else if [log][file][path] =~ /syslog|messages|kern/ {
      mutate { add_field => { "[event][dataset]" => "system.syslog" } }
    }
  }

  # ── 3. Establecer el índice de destino por dataset ─────────────────────────
  if [event][dataset] == "nginx.access" or [event][dataset] == "nginx.error" {
    mutate { replace => { "[@metadata][index]" => "logs-nginx" } }
  } else if [event][dataset] == "system.auth" {
    mutate { replace => { "[@metadata][index]" => "logs-auth" } }
  } else if [event][dataset] == "system.syslog" {
    mutate { replace => { "[@metadata][index]" => "logs-syslog" } }
  } else if [event][dataset] =~ /^kubernetes/ {
    mutate { replace => { "[@metadata][index]" => "logs-k8s" } }
  }

  # ── 4. Copiar log.file.path a un campo visible ────────────────────────────
  if [log][file][path] {
    mutate {
      copy => { "[log][file][path]" => "[@metadata][source_file]" }
    }
  }
}
