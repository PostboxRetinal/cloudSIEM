# =============================================================================
# PIPELINE 01 — INPUT
# Recibe eventos de Filebeat (puerto 5044) y Syslog directo (puerto 5514)
# =============================================================================

input {

  # ── Filebeat / Metricbeat ──────────────────────────────────────────────────
  beats {
    port => 5044
    host => "0.0.0.0"
    # client_inactivity_timeout: tiempo sin datos antes de cerrar conexión
    client_inactivity_timeout => 60
    # Añadir tag para saber que entró por este input
    add_field => { "[@metadata][input]" => "beats" }
  }

  # ── Syslog UDP (dispositivos de red, servidores legacy) ───────────────────
  udp {
    port  => 5514
    type  => "syslog-udp"
    codec => plain { charset => "UTF-8" }
    add_field => {
      "[@metadata][input]" => "syslog-udp"
      "event.dataset"      => "system.syslog"
    }
  }

  # ── Syslog TCP ────────────────────────────────────────────────────────────
  tcp {
    port  => 5514
    type  => "syslog-tcp"
    codec => line { charset => "UTF-8" }
    add_field => {
      "[@metadata][input]" => "syslog-tcp"
      "event.dataset"      => "system.syslog"
    }
  }
}
