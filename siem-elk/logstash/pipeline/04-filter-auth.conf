# =============================================================================
# PIPELINE 04 — FILTRO AUTH.LOG
# Parsea /var/log/auth.log (Debian/Ubuntu) y /var/log/secure (RHEL/CentOS)
# Detecta: SSH brute force, sudo escalation, PAM failures, cron auth
# Enriquece con GeoIP y campos SIEM para correlación de eventos
# =============================================================================

filter {

  if [event][dataset] == "system.auth" {

    # ════════════════════════════════════════════════════════════════════════
    # GROK PATTERNS — orden de más específico a más general
    # ════════════════════════════════════════════════════════════════════════

    # ── Patrón 1: SSH — intento fallido con usuario válido ──────────────────
    # Failed password for root from 185.220.101.34 port 54321 ssh2
    if !("_grokparsefailure" in [tags]) and [message] =~ /Failed password for / {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Failed password for %{DATA:[user][name]} from %{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int} %{GREEDYDATA:[auth][method]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_failed_pw"]
      }
      mutate {
        add_field => {
          "[event][action]"              => "authentication_failure"
          "[event][outcome]"             => "failure"
          "[event][category]"            => "authentication"
          "[event][type]"                => "start"
          "[siem][brute_force_attempt]"  => true
        }
        add_tag => ["auth_failure", "ssh_failure"]
      }
    }

    # ── Patrón 2: SSH — intento fallido con usuario INVÁLIDO ─────────────────
    # Failed password for invalid user ftp from 89.248.167.131 port 49823 ssh2
    else if !("_grokparsefailure" in [tags]) and [message] =~ /invalid user/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Failed password for invalid user %{DATA:[user][name]} from %{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int} %{GREEDYDATA:[auth][method]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_invalid_user"]
      }
      mutate {
        add_field => {
          "[event][action]"              => "authentication_failure"
          "[event][outcome]"             => "failure"
          "[event][category]"            => "authentication"
          "[siem][brute_force_attempt]"  => true
          "[siem][invalid_user]"         => true
        }
        add_tag => ["auth_failure", "ssh_failure", "invalid_user"]
      }
    }

    # ── Patrón 3: SSH — login exitoso (Accepted) ──────────────────────────
    # Accepted publickey for ubuntu from 192.168.1.20 port 52341 ssh2
    # Accepted password for deploy from 10.0.0.5 port 44123 ssh2
    else if !("_grokparsefailure" in [tags]) and [message] =~ /Accepted / {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Accepted %{DATA:[auth][method]} for %{DATA:[user][name]} from %{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int}"
        }
        tag_on_failure => ["_grokparsefailure_auth_accepted"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "authentication_success"
          "[event][outcome]"  => "success"
          "[event][category]" => "authentication"
          "[event][type]"     => "start"
        }
        add_tag => ["auth_success", "ssh_login"]
      }
    }

    # ── Patrón 4: SSH — desconexión / cierre de sesión ────────────────────
    # Disconnected from user ubuntu 192.168.1.20 port 52341
    # Connection closed by 185.220.101.34 port 54321
    else if !("_grokparsefailure" in [tags]) and [message] =~ /Disconnect|Connection closed/ {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Disconnected from (?:user %{DATA:[user][name]} )?%{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int}",
            "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Connection closed by %{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_auth_disconnect"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "session_end"
          "[event][category]" => "session"
          "[event][type]"     => "end"
        }
        add_tag => ["ssh_disconnect"]
      }
    }

    # ── Patrón 5: SSH — máximo de intentos de autenticación excedido ─────
    # error: maximum authentication attempts exceeded for root from 185.220.101.34 port 54321
    else if !("_grokparsefailure" in [tags]) and [message] =~ /maximum authentication attempts/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: error: maximum authentication attempts exceeded for %{DATA:[user][name]} from %{IPORHOST:[source][ip]} port %{NUMBER:[source][port]:int}"
        }
        tag_on_failure => ["_grokparsefailure_auth_maxattempts"]
      }
      mutate {
        add_field => {
          "[event][action]"              => "authentication_failure"
          "[event][outcome]"             => "failure"
          "[event][category]"            => "authentication"
          "[siem][max_attempts_exceeded]" => true
          "[siem][brute_force_attempt]"  => true
        }
        add_tag => ["auth_failure", "max_attempts_exceeded"]
      }
    }

    # ── Patrón 6: SUDO — ejecución de comando con privilegios ────────────
    # ubuntu : TTY=pts/0 ; PWD=/home/ubuntu ; USER=root ; COMMAND=/bin/bash
    else if !("_grokparsefailure" in [tags]) and [message] =~ /sudo.*COMMAND=/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} sudo\s*(?:\[%{POSINT:[process][pid]:int}\])?\s*:\s*%{DATA:[user][name]}\s*:\s*TTY=%{DATA:[process][tty]}\s*;\s*PWD=%{DATA:[process][working_directory]}\s*;\s*USER=%{DATA:[user][effective][name]}\s*;\s*COMMAND=%{GREEDYDATA:[process][command_line]}"
        }
        tag_on_failure => ["_grokparsefailure_sudo"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "sudo_command"
          "[event][category]" => "process"
          "[event][type]"     => "start"
          "[event][outcome]"  => "success"
        }
        add_tag => ["sudo_command", "privilege_escalation"]
      }

      # Comandos de alto riesgo vía sudo
      if [process][command_line] =~ /(?:\/bin\/bash|\/bin\/sh|\/usr\/bin\/python|\/usr\/bin\/perl|\/usr\/bin\/nc|netcat|chmod 777|chown root|passwd|visudo|\/etc\/sudoers)/ {
        mutate {
          add_tag   => ["high_risk_sudo"]
          add_field => { "[siem][high_risk_command]" => true }
        }
      }
    }

    # ── Patrón 7: SUDO — fallo de autenticación (contraseña incorrecta) ──
    # pam_unix(sudo:auth): authentication failure; logname= uid=1000 euid=0 tty=/dev/pts/0 ruser=ubuntu rhost=  user=ubuntu
    else if !("_grokparsefailure" in [tags]) and [message] =~ /sudo.*authentication failure/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: pam_unix\(sudo:auth\): authentication failure;.*uid=%{NUMBER:[user][id]}.*user=%{DATA:[user][name]}"
        }
        tag_on_failure => ["_grokparsefailure_sudo_fail"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "sudo_failure"
          "[event][category]" => "authentication"
          "[event][outcome]"  => "failure"
        }
        add_tag => ["sudo_failure"]
      }
    }

    # ── Patrón 8: PAM — apertura/cierre de sesión ─────────────────────────
    # pam_unix(sshd:session): session opened for user ubuntu by (uid=0)
    # pam_unix(sshd:session): session closed for user ubuntu
    else if !("_grokparsefailure" in [tags]) and [message] =~ /pam_unix.*session (opened|closed)/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: pam_unix\(%{DATA:[pam][service]}:session\): session %{DATA:[pam][session_action]} for user %{DATA:[user][name]}"
        }
        tag_on_failure => ["_grokparsefailure_pam_session"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "session_%{[pam][session_action]}"
          "[event][category]" => "session"
        }
      }
      if [pam][session_action] == "opened" {
        mutate { add_field => { "[event][type]" => "start" } }
      } else {
        mutate { add_field => { "[event][type]" => "end" } }
      }
    }

    # ── Patrón 9: SSH — escucha nueva conexión (informativo) ─────────────
    # sshd: Server listening on 0.0.0.0 port 22.
    else if !("_grokparsefailure" in [tags]) and [message] =~ /Server listening/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: Server listening on %{IPORHOST:[server][ip]} port %{NUMBER:[server][port]:int}"
        }
        tag_on_failure => []
      }
      mutate {
        add_field => {
          "[event][action]"   => "server_listening"
          "[event][category]" => "network"
          "[event][type]"     => "start"
        }
      }
    }

    # ── Patrón 10: Genérico — captura todo lo demás de auth.log ──────────
    else {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[auth][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[auth][message_text]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_generic"]
      }
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][kind]"     => "event"
        }
      }
    }

    # ════════════════════════════════════════════════════════════════════════
    # POST-PARSEO: campos comunes a todos los eventos de auth
    # ════════════════════════════════════════════════════════════════════════

    if "_grokparsefailure_auth_generic" not in [tags] {

      # Parsear timestamp syslog → @timestamp
      if [auth][timestamp] {
        date {
          # Syslog omite el año — Logstash asume el año actual
          match    => [ "[auth][timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
          target   => "@timestamp"
          timezone => "UTC"
          tag_on_failure => ["_dateparsefailure_auth"]
        }
        mutate { remove_field => [ "[auth][timestamp]" ] }
      }

      # Campos base
      mutate {
        add_field => {
          "[event][kind]"   => "event"
          "[event][module]" => "system"
        }
        convert => {
          "[process][pid]"    => "integer"
          "[source][port]"    => "integer"
          "[server][port]"    => "integer"
        }
      }

      # Detectar hora de acceso fuera de horario laboral (R8.4 — login fuera de horario)
      # Horario laboral: 09:00 – 18:00 GMT-5
      ruby {
        code => '
          ts = event.get("@timestamp")
          if ts
            # Evaluar horario local GMT-5 para login fuera de horario
            local_time = ts.time.getlocal("-05:00")
            hour = local_time.hour
            wday = local_time.wday   # 0=domingo, 6=sábado
            is_weekend    = (wday == 0 || wday == 6)
            is_after_hours = (hour < 9 || hour >= 18)
            action = event.get("[event][action]")
            actions = Array(action).compact
            if (is_after_hours || is_weekend) && actions.include?("authentication_success")
              event.set("[siem][after_hours_login]", true)
              event.tag("after_hours_login")
            end
          end
        '
      }
    }
  }
}
