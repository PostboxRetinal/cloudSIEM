# =============================================================================
# PIPELINE 06 — ENRIQUECIMIENTO GLOBAL
# Se ejecuta sobre TODOS los eventos después de los filtros por fuente
# 1. GeoIP lookup en source.ip
# 2. User-Agent parsing (para logs nginx)
# 3. Mutate final: limpieza, conversión de tipos, eliminación de campos internos
# 4. Marcar logs malformados para enviar al índice de errores
# =============================================================================

filter {

  # ════════════════════════════════════════════════════════════════════════════
  # 1. GeoIP — enriquecer source.ip con información geográfica
  # ════════════════════════════════════════════════════════════════════════════
  # Solo para IPs públicas (no enriquecer RFC 1918 ni loopback)
  if [source][ip] {
    # Filtrar IPs privadas / loopback / link-local
    if [source][ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|::1|fe80:)/ {
      geoip {
        source   => "[source][ip]"
        target   => "[source][geo]"
        # Campos que queremos — menos campos = índice más pequeño
        fields   => [
          "city_name",
          "country_code2",
          "country_name",
          "continent_name",
          "region_iso_code",
          "region_name",
          "location",
          "timezone"
        ]
        tag_on_failure => ["_geoip_lookup_failure"]
      }

      # ASN lookup omitido: la ruta MMDB hardcodeada no existe en Logstash 8.13.
    } else {
      # IP privada — enriquecer con red interna conocida
      mutate {
        add_field => {
          "[source][geo][country_name]"      => "Internal Network"
          "[source][geo][country_iso_code]"  => "LAN"
        }
      }
    }
  }

  # GeoIP también en destination.ip si existe
  if [destination][ip] {
    if [destination][ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)/ {
      geoip {
        source   => "[destination][ip]"
        target   => "[destination][geo]"
        fields   => ["city_name", "country_code2", "location"]
        tag_on_failure => []
      }
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # 2. USER-AGENT parsing
  # ════════════════════════════════════════════════════════════════════════════
  if [user_agent][original] and [user_agent][original] != "-" and [user_agent][original] != "" {
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent]"
      # Preservar el original después del parse
    }
    # Restaurar el campo original que useragent puede sobreescribir
    if ![user_agent][original] {
      mutate {
        rename => { "[user_agent][name]" => "[user_agent][original]" }
      }
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # 3. MUTATE FINAL — limpieza y normalización de todos los eventos
  # ════════════════════════════════════════════════════════════════════════════
  mutate {
    # ── Eliminar campos internos de Filebeat/Logstash ──────────────────────
    remove_field => [
      "agent.ephemeral_id",
      "ecs",                      # ya mapeado en ecs.version
      "[log][offset]",
      "input",
      "prospector",
      "beat",
      "[host][containerized]",
      "[host][os][codename]"
    ]

    # ── Conversión de tipos ────────────────────────────────────────────────
    convert => {
      "[http][response][status_code]" => "integer"
      "[http][response][body][bytes]" => "integer"
      "[source][port]"                => "integer"
      "[destination][port]"           => "integer"
      "[process][pid]"                => "integer"
      "[network][bytes]"              => "integer"
      "[network][ttl]"                => "integer"
    }

    # ── Normalizar strings vacíos y guiones a ausencia ─────────────────────
    gsub => [
      "[user][name]",          "^-$",  "",
      "[http][request][referrer]", "^-$",  "",
      "[user_agent][original]", "^-$",  ""
    ]
  }

  # ── Establecer severidad SIEM según tipo de evento ────────────────────────
  ruby {
    code => '
      tags = event.get("tags") || []
      if tags.include?("sqli_detected") || tags.include?("path_traversal") ||
         tags.include?("max_attempts_exceeded") || tags.include?("high_risk_sudo")
        event.set("[siem][severity]", "high")
        event.set("[event][severity]", 3)
      elsif tags.include?("auth_failure") || tags.include?("sensitive_path_access") ||
            tags.include?("security_scanner") || tags.include?("after_hours_login") ||
            tags.include?("firewall_block") || tags.include?("xss_detected")
        event.set("[siem][severity]", "medium")
        event.set("[event][severity]", 2)
      elsif tags.include?("auth_success") || tags.include?("sudo_command") ||
            tags.include?("service_failure")
        event.set("[siem][severity]", "low")
        event.set("[event][severity]", 1)
      else
        event.set("[siem][severity]", "informational")
        event.set("[event][severity]", 0)
      end
    '
  }

  # ════════════════════════════════════════════════════════════════════════════
  # 4. IDENTIFICAR LOGS MALFORMADOS → índice de errores
  # ════════════════════════════════════════════════════════════════════════════
  # Un log es malformado si tiene cualquier tag de parsefailure
  if [tags] {
    ruby {
      code => '
        tags = event.get("tags") || []
        failure_tags = tags.select { |t| t.to_s.start_with?("_grokparsefailure") }
        if failure_tags.length > 0
          event.set("[@metadata][index]", "logs-errors")
          event.set("[error][type]",    "grok_parse_failure")
          event.set("[error][message]", "Failed to parse with patterns: " + failure_tags.join(", "))
          event.set("[error][tags]",    failure_tags)
        end
      '
    }
  }
}
