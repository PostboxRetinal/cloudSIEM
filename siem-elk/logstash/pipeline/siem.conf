# =============================================================================
# Pipeline SIEM — Logstash
# Parseo, enriquecimiento y routing de logs de seguridad
# =============================================================================

input {
  # Beats (Filebeat, Metricbeat)
  beats {
    port => 5044
    ssl  => false
  }

  # Syslog UDP/TCP
  syslog {
    port     => 5514
    type     => "syslog"
    timezone => "UTC"
  }
}

# ─── Filters ─────────────────────────────────────────────────────────────────
filter {

  # ── Normalizar timestamp a @timestamp ECS ──────────────────────────────────
  date {
    match => ["timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
    timezone => "UTC"
  }

  # ── NGINX / Apache access logs ─────────────────────────────────────────────
  if [event][dataset] == "nginx.access" or [type] == "nginx" {
    grok {
      match => {
        "message" => [
          '%{IPORHOST:source.ip} - %{DATA:user.name} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http.request.method} %{DATA:url.original} HTTP/%{NUMBER:http.version}" %{NUMBER:http.response.status_code:int} %{NUMBER:http.response.body.bytes:long} "%{DATA:http.request.referrer}" "%{DATA:user_agent.original}"',
          '%{IPORHOST:source.ip} - - \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http.request.method} %{DATA:url.original} HTTP/%{NUMBER:http.version}" %{NUMBER:http.response.status_code:int} %{NUMBER:http.response.body.bytes:long}'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    if "_grokparsefailure_nginx" not in [tags] {
      # Extraer URL path y query
      grok {
        match => { "url.original" => "%{URIPATH:url.path}(?:\?%{URIQUERY:url.query})?" }
        tag_on_failure => []
      }

      # Detectar inyección SQL
      if [url.query] =~ /(?i)(union|select|insert|update|delete|drop|exec|script|'|--|;|\/\*)/ {
        mutate { add_tag => ["sqli_detected"] }
        mutate { add_field => { "siem.sqli_detected" => true } }
      }

      # Detectar XSS
      if [url.query] =~ /(?i)(<script|javascript:|onload=|onerror=|alert\()/ {
        mutate { add_tag => ["xss_detected"] }
        mutate { add_field => { "siem.xss_detected" => true } }
      }

      mutate {
        add_field => {
          "event.dataset"  => "nginx.access"
          "event.kind"     => "event"
          "event.category" => "web"
        }
      }
    }
  }

  # ── Auth logs (SSH, sudo, PAM) ─────────────────────────────────────────────
  if [event][dataset] == "system.auth" or [type] == "syslog" and [message] =~ /sshd|sudo|PAM/ {
    grok {
      match => {
        "message" => [
          # SSH failed login
          "%{SYSLOGTIMESTAMP:auth_timestamp} %{HOSTNAME:host.name} %{DATA:process.name}(?:\[%{POSINT:process.pid:int}\])?: Failed password for (?:invalid user )?%{DATA:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int}",
          # SSH accepted
          "%{SYSLOGTIMESTAMP:auth_timestamp} %{HOSTNAME:host.name} %{DATA:process.name}(?:\[%{POSINT:process.pid:int}\])?: Accepted %{WORD:auth.method} for %{DATA:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int}",
          # SSH invalid user
          "%{SYSLOGTIMESTAMP:auth_timestamp} %{HOSTNAME:host.name} %{DATA:process.name}(?:\[%{POSINT:process.pid:int}\])?: Invalid user %{DATA:user.name} from %{IPORHOST:source.ip}",
          # sudo
          "%{SYSLOGTIMESTAMP:auth_timestamp} %{HOSTNAME:host.name} %{DATA:process.name}(?:\[%{POSINT:process.pid:int}\])?: %{GREEDYDATA:message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_auth"]
    }

    if "_grokparsefailure_auth" not in [tags] {
      # Marcar intentos fallidos
      if [message] =~ /Failed password/ or [message] =~ /Invalid user/ {
        mutate {
          add_field => {
            "event.outcome"             => "failure"
            "event.action"              => "authentication_failure"
            "siem.brute_force_attempt"  => true
          }
          add_tag => ["auth_failure"]
        }
      } else if [message] =~ /Accepted/ {
        mutate {
          add_field => {
            "event.outcome" => "success"
            "event.action"  => "authentication_success"
          }
          add_tag => ["auth_success"]
        }
      }

      mutate {
        add_field => {
          "event.dataset"  => "system.auth"
          "event.kind"     => "event"
          "event.category" => "authentication"
        }
      }
    }
  }

  # ── Syslog genérico ────────────────────────────────────────────────────────
  if [type] == "syslog" and "_grokparsefailure_auth" in [tags] or [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:host.name} %{DATA:process.name}(?:\[%{POSINT:process.pid:int}\])?: %{GREEDYDATA:syslog_message}"
      }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }
    mutate {
      add_field => {
        "event.dataset" => "system.syslog"
        "event.kind"    => "event"
      }
    }
  }

  # ── GeoIP enrichment (para IPs fuente) ────────────────────────────────────
  if [source][ip] and [source][ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)/ {
    geoip {
      source        => "[source][ip]"
      target        => "[source][geo]"
      fields        => ["city_name", "country_iso_code", "location", "region_name"]
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  # ── Mutate: limpiar campos temporales ─────────────────────────────────────
  mutate {
    remove_field => [
      "agent.ephemeral_id", "ecs", "input", "log.offset",
      "nginx_timestamp", "auth_timestamp", "syslog_timestamp"
    ]
    convert => {
      "http.response.status_code" => "integer"
      "http.response.body.bytes"  => "integer"
      "source.port"               => "integer"
      "process.pid"               => "integer"
    }
  }
}

# ─── Output ──────────────────────────────────────────────────────────────────
output {

  # Logs malformados → índice de errores
  if "_grokparsefailure_nginx" in [tags] or
     "_grokparsefailure_syslog" in [tags] or
     "_grokparsefailure_auth" in [tags] {
    elasticsearch {
      hosts           => ["https://es01:9200"]
      user            => "elastic"
      password        => "${ELASTIC_PASSWORD}"
      ssl             => true
      cacert          => "/usr/share/logstash/config/certs/ca/ca.crt"
      index           => "logs-errors-%{+YYYY.MM.dd}"
      action          => "create"
    }
  }

  # Logs de nginx
  else if [event][dataset] == "nginx.access" {
    elasticsearch {
      hosts           => ["https://es01:9200"]
      user            => "elastic"
      password        => "${ELASTIC_PASSWORD}"
      ssl             => true
      cacert          => "/usr/share/logstash/config/certs/ca/ca.crt"
      index           => "logs-nginx-%{+YYYY.MM.dd}"
      action          => "create"
    }
  }

  # Logs de autenticación
  else if [event][dataset] == "system.auth" {
    elasticsearch {
      hosts           => ["https://es01:9200"]
      user            => "elastic"
      password        => "${ELASTIC_PASSWORD}"
      ssl             => true
      cacert          => "/usr/share/logstash/config/certs/ca/ca.crt"
      index           => "logs-auth-%{+YYYY.MM.dd}"
      action          => "create"
    }
  }

  # Logs de Kubernetes
  else if [kubernetes] {
    elasticsearch {
      hosts           => ["https://es01:9200"]
      user            => "elastic"
      password        => "${ELASTIC_PASSWORD}"
      ssl             => true
      cacert          => "/usr/share/logstash/config/certs/ca/ca.crt"
      index           => "logs-k8s-%{+YYYY.MM.dd}"
      action          => "create"
    }
  }

  # Syslog y demás
  else {
    elasticsearch {
      hosts           => ["https://es01:9200"]
      user            => "elastic"
      password        => "${ELASTIC_PASSWORD}"
      ssl             => true
      cacert          => "/usr/share/logstash/config/certs/ca/ca.crt"
      index           => "logs-syslog-%{+YYYY.MM.dd}"
      action          => "create"
    }
  }
}
