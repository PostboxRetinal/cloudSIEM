server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# TLS de entrada para asegurar acceso HTTPS en Kibana
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key

# Conexión al cluster
elasticsearch.hosts: ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]
elasticsearch.ssl.verificationMode: certificate

# No usamos Stack Monitoring ni la colección de métricas de Kibana en este stack
monitoring.kibana.collection.enabled: false
monitoring.ui.enabled: false

# Fleet no se usa en este stack; evita tareas y logs de agente/agentless
# xpack.fleet.enabled: false

# Reporting no se usa aquí y su arranque puede fallar bajo carga del cluster
xpack.reporting.enabled: false

# Telemetry/usage collection desactivado en el stack local
telemetry.optIn: true
telemetry.allowChangingOptInStatus: false

# Evita ruido de arranque; conserva WARN+ y ERROR
logging.root.level: warn

# Silencia el task de Cases que falla cuando no hay sesiones/casos activos
logging.loggers:
  - name: plugins.cases.incremental_id_task
    level: error
