server.name: kibana
server.host: "0.0.0.0"
server.port: 5601
server.protocol: http2

# TLS de entrada para eliminar la advertencia de HTTP/1 y usar HTTP/2 por defecto
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key

# Conexión al cluster
elasticsearch.hosts: ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]
elasticsearch.ssl.verificationMode: certificate

# Mantener el comportamiento Docker por defecto al usar un kibana.yml personalizado
monitoring.ui.container.elasticsearch.enabled: true

# Configuración de flota e índices (necesario para el SIEM)
xpack.fleet.outputs: [{id: fleet-default-output, name: default, type: elasticsearch, hosts: ["https://es01:9200"]}]

# Evita que se llene de logs innecesarios
logging.root.level: info
