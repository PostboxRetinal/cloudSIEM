# =============================================================================
# PIPELINE 07 — OUTPUT
# Routing inteligente a índices Elasticsearch según dataset y resultado de parseo
# Índice de errores separado para logs malformados (R8.3 — tasa parseo > 95%)
# =============================================================================

output {

  # ── Configuración TLS compartida (DRY via variables) ──────────────────────
  # Usamos un bloque separado por índice para control granular

  # ════════════════════════════════════════════════════════════════════════════
  # ÍNDICE DE ERRORES — logs malformados / no parseados
  # Criterio R8.3: rechazar logs malformados a índice separado con motivo
  # ════════════════════════════════════════════════════════════════════════════
  if [@metadata][index] == "logs-errors" {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      # Índice con fecha para facilitar purga
      index    => "logs-errors-%{+YYYY.MM.dd}"
      action   => "create"

      # Bulk settings — errores son menos frecuentes
      pool_max          => 1

      # Template propio para el índice de errores
      manage_template       => false   # ya creado por init-ilm.sh
      ilm_enabled           => true
      ilm_policy            => "siem-logs-policy"
      ilm_rollover_alias    => "logs-errors"

      # Retry en caso de fallo transitorio
      retry_initial_interval => 2
      retry_max_interval     => 64
    }

    # También loggear en stderr para monitoreo (opcional)
    # stdout { codec => rubydebug }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # NGINX — access y error logs
  # ════════════════════════════════════════════════════════════════════════════
  else if [@metadata][index] == "logs-nginx" {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      # Subdataset en el nombre del índice (access vs error)
      index    => "logs-nginx-%{+YYYY.MM.dd}"
      action   => "create"

      manage_template    => false
      ilm_enabled        => true
      ilm_policy         => "siem-logs-policy"
      ilm_rollover_alias => "logs-nginx"

      # Bulk settings ajustados para alto volumen de logs web
      pool_max          => 2
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # AUTH — logs de autenticación
  # ════════════════════════════════════════════════════════════════════════════
  else if [@metadata][index] == "logs-auth" {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      index    => "logs-auth-%{+YYYY.MM.dd}"
      action   => "create"

      manage_template    => false
      ilm_enabled        => true
      ilm_policy         => "siem-logs-policy"
      ilm_rollover_alias => "logs-auth"

      # Auth logs son críticos — retry agresivo
      retry_initial_interval => 1
      retry_max_interval     => 32
      pool_max               => 2
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # SYSLOG — logs de sistema
  # ════════════════════════════════════════════════════════════════════════════
  else if [@metadata][index] == "logs-syslog" {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      index    => "logs-syslog-%{+YYYY.MM.dd}"
      action   => "create"

      manage_template    => false
      ilm_enabled        => true
      ilm_policy         => "siem-logs-policy"
      ilm_rollover_alias => "logs-syslog"

      pool_max          => 1
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # KUBERNETES — logs de contenedores
  # ════════════════════════════════════════════════════════════════════════════
  else if [@metadata][index] == "logs-k8s" {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      index    => "logs-k8s-%{+YYYY.MM.dd}"
      action   => "create"

      manage_template    => false
      ilm_enabled        => true
      ilm_policy         => "siem-logs-policy"
      ilm_rollover_alias => "logs-k8s"

      pool_max          => 2
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # FALLBACK — eventos sin índice clasificado
  # Van al índice de errores con motivo "unclassified"
  # ════════════════════════════════════════════════════════════════════════════
  else {
    elasticsearch {
      hosts    => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

      index    => "logs-errors-%{+YYYY.MM.dd}"
      action   => "create"

      manage_template    => false
      ilm_enabled        => true
      ilm_policy         => "siem-logs-policy"
      ilm_rollover_alias => "logs-errors"
    }

    # Loggear en Logstash para debugging (descomentar si se investigan fallbacks)
    # stdout {
    #   codec => rubydebug { metadata => true }
    # }
  }
}
