# =============================================================================
# PIPELINE 05 — FILTRO SYSLOG
# Parsea /var/log/syslog, /var/log/messages, /var/log/kern.log
# Detecta: UFW blocks, OOM killer, errores de disco, fallos de servicio
# =============================================================================

filter {

  if [event][dataset] == "system.syslog" {

    # ── Patrón 1: UFW / iptables BLOCK ────────────────────────────────────
    # Apr 25 14:32:01 web-01 kernel: [UFW BLOCK] IN=eth0 OUT= MAC=... SRC=185.220.101.34 DST=10.0.0.1 LEN=60 TOS=0x00 PREC=0x00 TTL=47 ID=12345 DF PROTO=TCP SPT=54321 DPT=22
    if [message] =~ /UFW BLOCK|iptables.*DROP|DROPPED/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} kernel: \[%{DATA:[syslog][kernel_time]}\] \[%{DATA:[firewall][rule]}\] IN=%{DATA:[network][interface][ingress][name]} OUT=%{DATA:[network][interface][egress][name]}(?: MAC=%{DATA:[network][mac]})? SRC=%{IPORHOST:[source][ip]} DST=%{IPORHOST:[destination][ip]}(?: LEN=%{NUMBER:[network][bytes]:int})?(?: TTL=%{NUMBER:[network][ttl]:int})? PROTO=%{WORD:[network][transport]}(?: SPT=%{NUMBER:[source][port]:int})?(?: DPT=%{NUMBER:[destination][port]:int})?"
        }
        tag_on_failure => ["_grokparsefailure_ufw"]
      }
      if "_grokparsefailure_ufw" not in [tags] {
        mutate {
          add_field => {
            "[event][category]"    => "network"
            "[event][type]"        => "denied"
            "[event][action]"      => "firewall_block"
            "[event][kind]"        => "event"
            "[event][outcome]"     => "failure"
          }
          add_tag => ["firewall_block"]
        }
      }
    }

    # ── Patrón 2: OOM Killer ───────────────────────────────────────────────
    # kernel: Out of memory: Kill process 1234 (python3) score 800 or sacrifice child
    else if [message] =~ /Out of memory|oom-kill|OOM/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} kernel(?:\[%{POSINT:[process][pid]:int}\])?: (?:Out of memory: Kill process %{NUMBER:[siem][oom_killed_pid]:int} \(%{DATA:[siem][oom_killed_process]}\) score %{NUMBER:[siem][oom_score]:int}|%{GREEDYDATA:[syslog][oom_message]})"
        }
        tag_on_failure => ["_grokparsefailure_oom"]
      }
      mutate {
        add_field => {
          "[event][category]" => "host"
          "[event][type]"     => "error"
          "[event][kind]"     => "alert"
          "[log][level]"      => "critical"
        }
        add_tag => ["oom_killer", "system_critical"]
      }
    }

    # ── Patrón 3: Errores de disco / I/O ──────────────────────────────────
    # kernel: Buffer I/O error on dev sda1, logical block 123456, lost async page write
    # kernel: EXT4-fs error (device sda1): ...
    else if [message] =~ /I\/O error|EXT4-fs error|XFS.*error|disk.*error|SCSI error/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} kernel(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[error][message]}"
        }
        tag_on_failure => ["_grokparsefailure_disk"]
      }
      mutate {
        add_field => {
          "[event][category]" => "host"
          "[event][type]"     => "error"
          "[event][kind]"     => "alert"
          "[log][level]"      => "error"
        }
        add_tag => ["disk_error", "system_warning"]
      }
    }

    # ── Patrón 4: Systemd — fallo de servicio ────────────────────────────
    # systemd[1]: nginx.service: Main process exited, code=killed, status=9/KILL
    # systemd[1]: nginx.service: Failed with result 'exit-code'.
    else if [message] =~ /systemd.*[Ff]ailed|\.service.*[Ff]ailed|\.service.*error/ {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} systemd(?:\[%{POSINT:[process][pid]:int}\])?: %{DATA:[service][name]}\.service: (?:Main process exited, code=%{DATA:[process][exit_code]}, status=%{DATA:[process][exit_status]}|Failed with result '%{DATA:[service][result]}'|%{GREEDYDATA:[service][message]})",
            "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} systemd(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[service][message]}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_systemd_fail"]
      }
      mutate {
        add_field => {
          "[event][category]" => "process"
          "[event][type]"     => "error"
          "[event][kind]"     => "event"
          "[log][level]"      => "error"
        }
        add_tag => ["service_failure"]
      }
    }

    # ── Patrón 5: Cron jobs ───────────────────────────────────────────────
    # CRON[1234]: (root) CMD (/usr/bin/python3 /opt/backup.py)
    else if [message] =~ /CRON|crond/ {
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} CRON\[%{POSINT:[process][pid]:int}\]: \(%{DATA:[user][name]}\) %{DATA:[cron][action]} \(%{GREEDYDATA:[cron][command]}\)"
        }
        tag_on_failure => ["_grokparsefailure_cron"]
      }
      mutate {
        add_field => {
          "[event][category]" => "process"
          "[event][type]"     => "start"
          "[event][kind]"     => "event"
        }
        add_tag => ["cron_job"]
      }
    }

    # ── Patrón 6: Syslog genérico RFC 3164 ───────────────────────────────
    # Apr 25 14:32:01 web-01 ntpd[1234]: synchronized to 192.168.1.1, stratum 2
    else {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[syslog][message]}",
            "%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[host][name]} %{GREEDYDATA:[syslog][message]}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_syslog_generic"]
      }
      mutate {
        add_field => {
          "[event][category]" => "host"
          "[event][kind]"     => "event"
        }
      }
    }

    # ── POST-PARSEO: campos comunes a todos los syslog ────────────────────
    if "_grokparsefailure_syslog_generic" not in [tags] {

      # Timestamp → @timestamp
      if [syslog][timestamp] {
        date {
          match    => [ "[syslog][timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
          target   => "@timestamp"
          timezone => "UTC"
          tag_on_failure => ["_dateparsefailure_syslog"]
        }
        mutate { remove_field => ["[syslog][timestamp]"] }
      }

      # Limpiar y tipar
      mutate {
        add_field  => { "[event][module]" => "system" }
        convert    => { "[process][pid]" => "integer" }
        remove_field => ["[syslog][kernel_time]"]
      }

      # Extraer nivel de log del campo si viene en el mensaje
      if [message] and ("error" in [message] or "[error]" in [message]) {
        if ![log][level] {
          mutate { add_field => { "[log][level]" => "error" } }
        }
      } else if [message] and ("warn" in [message] or "warning" in [message] or "[warn]" in [message]) {
        if ![log][level] {
          mutate { add_field => { "[log][level]" => "warning" } }
        }
      } else if [message] and ("info" in [message] or "notice" in [message] or "[info]" in [message]) {
        if ![log][level] {
          mutate { add_field => { "[log][level]" => "info" } }
        }
      }
    }
  }
}
